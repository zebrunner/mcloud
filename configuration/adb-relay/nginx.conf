# The nginx of adb-relay (README.md#remote-debug-through-the-adb-relay): a TCP relay of the port ranges of the device
# hosts in a private network for the remote debug of STF (adb connect). ./zebrunner.sh writes its servers into
# relay-hosts.conf from ADB_RELAY_HOSTS of .env, the image makes /etc/nginx/stream-conf.d/relay-hosts.conf of it with the
# resolvers of the host (a template of the image).
user nginx;
worker_processes 1;
# every port of the ranges is a socket and a connection of the worker, every adb session two more
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 16384;
}

stream {
  log_format relay '$remote_addr [$time_local] $server_port -> $upstream_addr $status $bytes_sent $bytes_received $session_time';
  access_log /var/log/nginx/access.log relay;

  proxy_connect_timeout 10s;
  # an adb session stays open while the user debugs and may be idle for long; TCP keepalive ends the dead ones
  proxy_timeout 24h;
  proxy_socket_keepalive on;

  include /etc/nginx/stream-conf.d/*.conf;
}

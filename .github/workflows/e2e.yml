---
name: E2E

# The farm end to end (README.md#development): the images built from the branches of their repositories
# (tests/e2e/build-images.sh), MCloud of this checkout, a device host of mcloud-agent and an Android emulator
on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  # the develop branches of the other repositories change every day
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch of the other repositories (E2E_REF)
        default: develop
      refs:
        description: The branches of single repositories (E2E_REFS), e.g. STF_REF=fix/x MCLOUD_AGENT_REF=feat/y
        default: ""
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # id-token: the login to public.ecr.aws (the base images of the builds)
    permissions:
      contents: read
      id-token: write
    env:
      E2E_REF: ${{ inputs.ref || 'develop' }}
      E2E_REFS: ${{ inputs.refs || 'MCLOUD_AGENT_REF=fix/pull-used-connectors STF_REF=fix/minicap-apk-without-lib' }}
    steps:
      - uses: actions/checkout@v7
      - name: The directories of the run
        run: |
          {
            echo "E2E_DIR=${RUNNER_TEMP}/e2e"
            echo "E2E_AGENT_DIR=${RUNNER_TEMP}/e2e/mcloud-agent"
            echo "E2E_LOGS=${RUNNER_TEMP}/e2e-logs"
            echo "JUNIT_DIR=${RUNNER_TEMP}/e2e-junit"
          } >> "$GITHUB_ENV"
      - name: Make room for the images and the AVD
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      # the anonymous pulls of public.ecr.aws are limited to 1 per second per IP of the runners
      - uses: zebrunner/mcloud-conventions/.github/actions/ecr-public-login@v1
      - name: Install socat and ansible
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q socat
          pipx install ansible-core
          ansible-playbook --version
      - name: Build the images of the branches
        run: |
          tests/e2e/build-images.sh "$E2E_DIR"
          docker builder prune -af > /dev/null
          df -h /
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - name: The farm with an Android emulator
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 720
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/e2e/emulator.sh
      - name: E2E report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: ${{ env.JUNIT_DIR }}/*.xml
          check_name: e2e report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload the logs and JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            ${{ env.E2E_LOGS }}
            ${{ env.JUNIT_DIR }}
          if-no-files-found: warn

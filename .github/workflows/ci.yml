---
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # the reusable lint job of mcloud-conventions (CONVENTIONS.md)
  lint:
    uses: zebrunner/mcloud-conventions/.github/workflows/lint.yml@v1

  # the OS of the tests: zebrunner.sh runs on Linux and macOS servers; a macOS runner waits ~10 minutes for a 1 minute
  # job, so a pull request runs on macOS only when it changes a file of `make test` (the scripts, their settings and
  # tests, this workflow); the pushes and the manual runs always do
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: The OS of the tests
        id: os
        env:
          EVENT: ${{ github.event_name }}
        run: |
          macos=true
          if [[ "$EVENT" == pull_request ]]; then
            # the checkout is the merge commit of the pull request, its first parent the base branch
            files="$(git diff --name-only HEAD^1 HEAD)"
            # the files of `make test`: zebrunner.sh, what it sources and reads, the scripts of configuration and patch,
            # the tests and the Makefile
            paths=(
              'zebrunner\.sh' 'Makefile' '\.env\.original' 'variables\.env\.original' 'docker-compose\.yml' 'backup/'
              'configuration/' 'patch/' 'tests/[^/]+\.sh' 'tests/fixtures/' '\.github/workflows/ci\.yml'
            )
            if ! grep -qE "^($(IFS='|' && echo "${paths[*]}"))" <<< "$files"; then
              macos=false
              echo "::notice::no file of make test changed: the tests run on Linux only"
            fi
          fi
          if [[ "$macos" == true ]]; then
            echo 'os=["ubuntu-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Tests without docker (make test)
        run: make test
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Tests report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: tests report (${{ matrix.os }})
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload tests JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: ${{ runner.temp }}/junit/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: the login to public.ecr.aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # the anonymous pulls of public.ecr.aws are limited to 1 per second per IP of the runners
      - uses: zebrunner/mcloud-conventions/.github/actions/ecr-public-login@v1
      - name: The services with the images of .env.original (make docker)
        run: make docker
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Docker report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: docker report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-docker
          path: ${{ runner.temp }}/junit/

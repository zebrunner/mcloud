---
version: 2
# no docker: the tags of .env.original are the releases of the STF and grid images, they are set by hand with the
# changes of docker-compose.yml they need
updates:
  # actions/* and the other actions of .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # ruff, the project linter of tests/requirements-lint.txt; the shared linters are updated in mcloud-conventions
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    ignore:
      - dependency-name: actionlint-py
      - dependency-name: hadolint-py
      - dependency-name: pymarkdownlnt
      - dependency-name: shellcheck-py
      - dependency-name: shfmt-py
      - dependency-name: yamllint
  # @playwright/test of the example of the Playwright tests (package-lock.json)
  - package-ecosystem: npm
    directory: /examples/playwright
    schedule:
      interval: weekly
